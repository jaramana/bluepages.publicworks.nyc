<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Blue Pages</title>
<link rel="canonical" href="https://bluepages.publicworks.nyc/">
<meta name="description" content="Browse New York City’s agency list, with published leadership and reporting lines, plus Green Book contacts and payroll counts where available.">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/d3.min.js" defer></script>
<script src="vendor/d3-flextree.js" defer></script>
<script src="vendor/d3-org-chart.js" defer></script>
<script src="data/agencies.js" defer></script>
<script src="data/greenbook.js" defer></script>
<script src="data/payroll.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="masthead">
    <a class="wordmark" href="./" data-nav>The Blue Pages</a>
    <p class="subtitle">An independent directory of organizations in New York City’s agency list.</p>
  </div>
  <nav class="topnav" aria-label="Sections">
    <a href="./" data-nav data-view="">Directory</a>
    <a href="?view=chart" data-nav data-view="chart">Org Chart</a>
    <a href="?view=quiz" data-nav data-view="quiz">Quiz</a>
    <a href="?view=about" data-nav data-view="about">About</a>
  </nav>
</header>

<div class="layout">
  <aside class="rail" aria-label="Index of agencies">
    <div class="rail-intro">
      <p>Look up any of the <span data-total>307</span> organizations in the City’s agency list to see its published leadership and reporting line. Not an official City product.</p>
    </div>
    <div class="rail-head">
      <label class="visually-hidden" for="q">Look up an agency</label>
      <input id="q" type="search" autocomplete="off" placeholder="Look up an agency">
      <div class="filters" id="filters"></div>
      <p class="rail-status" id="rail-status" aria-live="polite"></p>
    </div>
    <div class="rail-list" id="rail-list"></div>
  </aside>

  <main id="main" class="main" tabindex="-1"></main>
</div>
</body>
</html>
